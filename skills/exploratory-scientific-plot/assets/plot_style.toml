# 项目绘图样式模板：由绘图代码主动读取；不是 Codex config.toml。
# 这是建议初值。已有项目的配色与明确规范优先。
# 解析顺序：base → profiles.<用途> → figures.<图ID>.style。
schema_version = 1
style_name = "kolf-inspired"

[base]
font_family = "Arial"
font_fallbacks = ["Helvetica", "Liberation Sans", "DejaVu Sans"]
cjk_font_candidates = ["Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei"]
background = "#FFFFFF"
foreground = "#333333"
panel_background = "#F8F8F8"
grid = false
spines_top = false
spines_right = false
axes_linewidth_pt = 0.8
line_width_pt = 1.2
marker_size_pt2 = 7.0
marker_alpha = 0.7
marker_edge_color = "#FFFFFF"
marker_edge_width_pt = 0.3
legend_frame = false
categorical_palette = "bold"
sequential_colormap = "GnBu"
diverging_colormap = "RdBu"
diverging_center = 0.0
# 色图中心只对有明确零点意义的发散图生效；范围按数据/任务确定。

[semantic_colors]
reference = "#B0B0B0"
muted = "#D9D9D9"
blue = "#367CB7"
blue_fill = "#EDF6FF"
highlight = "#E75480"
upregulated = "#78C0AF"
downregulated = "#E7857C"
threshold = "#5CB39D"
# 先确认语义再使用；不要自动把未确认的对照/方向赋成这些颜色。

[palettes]
# Plotly qualitative.Bold；名字表示分类色板，不表示连续值顺序。
bold = ["#7F3C8D", "#11A579", "#3969AC", "#F2B701", "#E73F74", "#80BA5A", "#E68310", "#008695", "#CF1C90", "#F97B72", "#A5AA99"]

[figure_legend]
# 正式版使用论文式完整图注，正文存外部 Markdown；探索版仍可简述。
formal_required = true
placement = "outside_figure"
content_file = "figure_legend.md"
in_figure_notes = "essential_only"
ppt_full_legend = "readable_below_or_caption_page_or_notes"

[groups]
# 首次使用时填入真实且稳定的组别键；绘图排序/筛选不得改变映射。
# 示例（需要确认数据含义后再取消注释）：
# "condition:control" = "#B0B0B0"
# "condition:treatment" = "#E75480"

[profiles.explore]
width_in = 6.4
height_in = 4.8
font_size_pt = 11.0
axis_label_size_pt = 11.0
tick_label_size_pt = 10.0
legend_size_pt = 10.0
annotation_size_pt = 10.0
title_size_pt = 12.0
panel_label_size_pt = 13.0
marker_size_pt2 = 12.0
dpi = 130
formats = ["png"]
label_budget = 8
# label_budget 为起始建议，不是隐藏关键标签的硬上限。

[profiles.formal_md]
width_in = 7.2
height_in = 4.5
font_size_pt = 10.0
axis_label_size_pt = 10.0
tick_label_size_pt = 9.0
legend_size_pt = 9.0
annotation_size_pt = 9.0
title_size_pt = 12.0
panel_label_size_pt = 14.0
dpi = 220
formats = ["svg", "png"]
label_budget = 12

[profiles.formal_ppt]
width_in = 9.0
height_in = 5.0
font_size_pt = 18.0
axis_label_size_pt = 18.0
tick_label_size_pt = 16.0
legend_size_pt = 16.0
annotation_size_pt = 16.0
title_size_pt = 20.0
panel_label_size_pt = 22.0
marker_size_pt2 = 28.0
axes_linewidth_pt = 1.0
line_width_pt = 1.5
dpi = 220
formats = ["svg", "png"]
label_budget = 8
# 最终 PPT 中若缩放插入，必须按实际显示大小复查文字。

[profiles.formal_paper]
# 只有明确论文/投稿用途才使用；期刊实际要求覆盖这里。
width_in = 7.1
height_in = 4.5
font_size_pt = 8.0
axis_label_size_pt = 8.0
tick_label_size_pt = 7.0
legend_size_pt = 7.0
annotation_size_pt = 7.0
title_size_pt = 9.0
panel_label_size_pt = 10.0
dpi = 300
formats = ["pdf", "png"]
label_budget = 12

# 单图 override 示例：需要时使用稳定图ID，而非每次随机文件名。
# [figures.embedding_overview.style]
# width_in = 8.0
# height_in = 8.0
# marker_size_pt2 = 10.0
# marker_alpha = 0.6
#
# 仅本图改某组颜色，不更改全项目 groups：
# [figures.embedding_overview.groups]
# "condition:treatment" = "#367CB7"
#
# 当前图才需要的显示设置，由绘图代码读取，不当作统计参数：
# [figures.embedding_overview.display]
# equal_aspect = true
# label_keys = ["example_key"]
